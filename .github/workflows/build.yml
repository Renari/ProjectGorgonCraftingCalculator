name: Build

on:
  pull_request:
    branches:
      - master

concurrency:
  group: "pr-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SvelteKit static application
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          ORIGIN: https://${{ github.repository_owner }}.github.io
